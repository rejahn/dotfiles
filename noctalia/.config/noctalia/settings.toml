[osd]
position = "bottom_center"

[[plugins.source]]
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
name = "official"

[[plugins.source]]
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
name = "community"

[shell]
avatar_path = "/home/renan/Pictures/renan.png"
font_family = "Noto Sans"

    [shell.session]
    grid_columns = 5

[theme]
source = "wallpaper"

[wallpaper.default]
path = "/home/renan/Pictures/Wallpapers/kalen-emsley-Bkci_8qcdvQ-unsplash.jpg"

[wallpaper.last]
path = "/home/renan/Pictures/Wallpapers/kalen-emsley-Bkci_8qcdvQ-unsplash.jpg"

