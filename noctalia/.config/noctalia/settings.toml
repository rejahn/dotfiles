    [wallpaper.monitors.HDMI-A-1]
    path = "/home/renan/Pictures/Wallpapers/kalen-emsley-Bkci_8qcdvQ-unsplash.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/renan/Pictures/Wallpapers/kalen-emsley-Bkci_8qcdvQ-unsplash.jpg"

[widget.brightness]
